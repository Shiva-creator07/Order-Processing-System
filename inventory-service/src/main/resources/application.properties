spring.application.name=inventory-service

spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.cloud.stream.kafka.binder.brokers=localhost:9092

spring.cloud.stream.bindings.inventoryProcessor-in-0.destination=order.created
spring.cloud.stream.bindings.inventoryProcessor-in-0.group=inventory-service

spring.cloud.stream.bindings.inventoryProcessor-out-0.destination=inventory.events
spring.cloud.stream.bindings.inventoryProcessor-out-0.content-type=application/json
